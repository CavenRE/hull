services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:alpine
    container_name: hull-router
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    environment:
      - CADDY_INGRESS_NETWORKS=caddy
    networks:
      - caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: hull-adminer
    labels:
      caddy: db.test # Will be replaced by setup script if TLD differs, or handled dynamically.
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.tls: internal
    networks:
      - caddy
    volumes:
      - ./hull-login.php:/var/www/html/plugins-enabled/hull-login.php:ro
    restart: unless-stopped

networks:
  caddy:
    external: true

volumes:
  caddy_data:

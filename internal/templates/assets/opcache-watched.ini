; Managed by Hull. Mounted only when BOTH are true: the project lives on a slow
; bind mount (a Windows drive served to Docker over 9p), and Hull's daemon is
; watching it for source changes (auto_reload, on by default).
;
; What it does: stops PHP checking the modification time of every file it has
; cached, on every request. That check is the single largest per-request cost on
; a 9p mount, because each stat() crosses the VM boundary and costs milliseconds
; rather than microseconds. A framework request touching a thousand files pays
; it a thousand times.
;
; Why it is safe here: normally turning this off means an edit never shows up
; until the container restarts. Hull instead watches the project from the host,
; where filesystem events are immediate, and resets the opcode cache the moment
; you save. So you get the speed of not revalidating, and edits still appear on
; the next refresh.
;
; To opt out, set auto_reload: false in ~/.hull/config.yaml (Hull then stops
; watching and stops mounting this file, so PHP goes back to revalidating), or
; override the setting in your project's own .hull/php.ini, which loads last.
opcache.validate_timestamps=0

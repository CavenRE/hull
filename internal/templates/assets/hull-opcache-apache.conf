# Managed by Hull. Serves Hull's opcode cache helper to this container alone.
# It checks CONN_REMOTE_ADDR, the real peer of the connection: the image's
# mod_remoteip trusts X-Forwarded-For from private addresses, so the router's
# requests could otherwise pass as 127.0.0.1.
Alias /__hull/opcache /opt/hull/hull-opcache.php
<Directory "/opt/hull">
    Require expr "%{CONN_REMOTE_ADDR} == '127.0.0.1'"
</Directory>

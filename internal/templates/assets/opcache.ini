; Managed by Hull. PHP OPcache tuning for fast local page loads, especially
; over a Windows/WSL2 bind mount where recompiling on every request is slow.
; Hull mounts this into every PHP container's conf.d. Edit it to taste; Hull
; never overwrites an existing copy. For a "prod-like" mode that skips the
; per-request timestamp check entirely, set opcache.validate_timestamps=0 (you
; then reset OPcache by restarting the container after a code change).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.fast_shutdown=1

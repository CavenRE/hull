; Managed by Hull. PHP performance tuning (OPcache, JIT, realpath cache) for
; fast local page loads, especially over a Windows/WSL2 bind mount where
; recompiling on every request is slow. Hull mounts this into every PHP
; container's conf.d. Edit it to taste: Hull updates this file only while it is
; an unchanged copy of one Hull shipped before, never once you have edited it.
; For a "prod-like" mode that skips the per-request timestamp check entirely,
; set opcache.validate_timestamps=0 (you then reset OPcache by restarting the
; container after a code change).
opcache.enable=1
opcache.enable_cli=0
; Room for a plugin-heavy WordPress or a Laravel app with its vendor tree. A
; full cache stops caching new files, and those then compile on every request.
opcache.memory_consumption=512
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=65000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.fast_shutdown=1

; JIT: compile hot PHP paths to machine code. Helps CPU-bound work and is
; harmless for I/O-bound requests. tracing is the general-purpose mode.
opcache.jit=tracing
opcache.jit_buffer_size=64M

; realpath cache: fewer path stat() calls per request, which matters a lot over
; a slow bind mount where each stat crosses the VM boundary.
realpath_cache_size=4096K
realpath_cache_ttl=600

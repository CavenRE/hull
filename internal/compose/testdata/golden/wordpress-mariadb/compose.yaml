      - --
    command: apache2-foreground
    environment:
      - HULL_WRITABLE_PATHS=wp-content wp-content/uploads wp-content/upgrade
      - WORDPRESS_CONFIG_EXTRA=define('DISABLE_WP_CRON', true);

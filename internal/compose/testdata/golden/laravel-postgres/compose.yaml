name: myapp
services:
  app:
    image: serversideup/php:8.4-fpm-nginx
    volumes:
      - ./:/var/www/html
      - /home/test/.hull/system/php/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
    ports:
      - 127.0.0.1::8080
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - caddy=myapp.test
      - caddy.reverse_proxy={{upstreams 8080}}
      - caddy.tls=internal
    networks:
      - default
      - caddy
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=myapp
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - default
      - caddy
networks:
  caddy:
    external: true
volumes:
  db_data: null

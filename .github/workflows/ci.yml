name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          if ! go test ./... 2>&1 | tee test-output.txt; then
            msg=$(grep -E -A 12 '^(--- FAIL|FAIL|panic)' test-output.txt | tail -c 3000)
            msg="${msg//$'\n'/%0A}"
            echo "::error title=go test failed::${msg}"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  gui:
    name: gui syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: node --check every frontend module
        run: |
          set -e
          for f in gui/dist/*.js; do node --check "$f"; done

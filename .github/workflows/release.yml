name: Release

# Ship a release:  git tag v0.1.0 && git push origin v0.1.0
# (Requires Actions enabled on the repo.) Builds Hull's own installer
# (Hull-Setup.exe) for Windows and binary tarballs for Linux/macOS, and attaches
# them to a draft GitHub Release. No NSIS — Hull-Setup.exe is our self-contained
# WebView2 installer.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Hull-Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = 'cmd/hull-setup/payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          # daemon + CLI sidecars
          go build -ldflags '-s -w' -o "$payload/hulld.exe" ./cmd/hulld
          go build -ldflags '-s -w' -o "$payload/hull.exe"  ./cmd/hull

          # GUI (no bundling — just the exe + WebView2 loader)
          Push-Location gui/src-tauri
          try { cargo build --release } finally { Pop-Location }
          Copy-Item gui/src-tauri/target/release/hull-gui.exe $payload
          $wv = 'gui/src-tauri/target/release/WebView2Loader.dll'
          if (Test-Path $wv) { Copy-Item $wv $payload }

          # pack the payload and build the installer (GUI app — no console)
          Compress-Archive -Path "$payload/*" -DestinationPath cmd/hull-setup/payload.zip -Force
          go build -tags installer -ldflags '-s -w -H windowsgui' -o Hull-Setup.exe ./cmd/hull-setup

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: Hull-Setup.exe

  unix:
    name: ${{ matrix.target }} binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux GUI build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build binaries
        shell: bash
        run: |
          set -e
          mkdir -p dist
          go build -ldflags '-s -w' -o dist/hulld ./cmd/hulld
          go build -ldflags '-s -w' -o dist/hull  ./cmd/hull
          ( cd gui/src-tauri && cargo build --release )
          cp gui/src-tauri/target/release/hull-gui dist/
          tar -czf "hull-${{ matrix.target }}.tar.gz" -C dist .

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: hull-${{ matrix.target }}.tar.gz

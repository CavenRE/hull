name: Release

# Build, sign and publish all four platform binaries whenever a v* tag is
# pushed. Cutting a release is then just: bump CHANGELOG, commit,
# `git tag vX.Y.Z`, `git push --tags`.
#
# Three jobs so that each holds the least it needs: build has a read-only
# token and no build cache (a poisoned cache cannot reach a release), sign
# alone sees the signing key, and publish alone can write to the repository.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build binaries
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X github.com/CavenRE/hull/internal/version.Version=${VER} -X github.com/CavenRE/hull/internal/version.Commit=${COMMIT}"
          mkdir -p dist
          # Rebuilt from versioninfo.json and hull.ico, so the release never
          # links the committed blob, and Windows shows the tag's version.
          ( cd cmd/hull && go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0 -64 \
              -propagate-ver-strings -file-version "${VER#v}" -product-version "${VER#v}" \
              -o resource_windows_amd64.syso versioninfo.json )
          build() { CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$LDFLAGS" -o "dist/$3" ./cmd/hull; }
          build windows amd64 hull-windows-x64.exe
          build linux   amd64 hull-linux-x64
          build darwin  amd64 hull-macos-intel
          build darwin  arm64 hull-macos-apple-silicon
          # The first line names the release, so `hull update` refuses an old
          # signed checksum file replayed under a newer tag.
          ( cd dist && { echo "# hull ${VER}"; sha256sum hull-*; } > SHA256SUMS )
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Sign checksums
        env:
          HULL_SIGNING_KEY: ${{ secrets.HULL_SIGNING_KEY }}
        run: |
          set -euo pipefail
          go run ./tools/sign sign dist/SHA256SUMS
          # Fails when internal/version.ReleaseKey is unset or does not match
          # the secret, so a release that `hull update` would refuse never ships.
          go run ./tools/sign verify dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signature
          path: dist/SHA256SUMS.sig
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signature
          path: dist

      - name: Extract release notes
        run: |
          set -euo pipefail
          VER_NO_V="${GITHUB_REF_NAME#v}"
          awk -v v="[$VER_NO_V]" 'index($0,"## "v){f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md for details." > notes.md; fi
          {
            echo ""
            echo "## Install"
            echo "- Windows: download \`hull-windows-x64.exe\`, rename to \`hull.exe\`, run \`hull.exe install\`."
            echo "- Linux: \`hull-linux-x64\`. macOS: \`hull-macos-apple-silicon\` or \`hull-macos-intel\`."
            echo "- Already installed on a prebuilt platform: run \`hull update\`."
            echo "- \`SHA256SUMS\` lists each file's checksum; \`SHA256SUMS.sig\` is its ed25519 signature, which \`hull update\` checks."
          } >> notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" \
            dist/hull-windows-x64.exe dist/hull-linux-x64 dist/hull-macos-intel dist/hull-macos-apple-silicon \
            dist/SHA256SUMS dist/SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" --clobber

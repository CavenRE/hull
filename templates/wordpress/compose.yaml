services:
  db:
    image: mariadb:lts
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: wordpress
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - default
      - caddy

  wordpress:
    image: wordpress:latest
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ""
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./:/var/www/html
      - ${HOME}/.hull/system/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      caddy: {{SITE_NAME}}.{{TLD}}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.tls: internal
    networks:
      - default
      - caddy

networks:
  caddy:
    external: true

volumes:
  db_data:

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hull , Design System</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { background: #16181c; overflow-y: auto; }
  .ds-wrap { max-width: 1180px; margin: 0 auto; padding: 40px 32px 80px; }
  .ds-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; color: #e7e9ec; font-family: var(--font-sans); }
  .ds-head .glyph { width: 18px; height: 18px; border-radius: 5px; background: #3b82f6; display: inline-block; transform: rotate(45deg); }
  .ds-head h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .ds-head .sub { color: #9aa1a9; font-size: 13px; }
  .ds-sectitle { color: #c7ccd2; font-family: var(--font-sans); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin: 38px 0 14px; }

  /* the two theme panes */
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .pane { border-radius: 14px; border: 1px solid var(--border); background: var(--bg-app); padding: 22px; overflow: hidden; }
  .pane-label { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .pane-label::before { content:""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  .kit-h { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin: 22px 0 10px; }
  .kit-h:first-child { margin-top: 0; }
  .rowflex { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .colflex { display: flex; flex-direction: column; gap: 10px; }

  /* swatches */
  .swgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sw { border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .sw .chip-col { height: 46px; }
  .sw .sw-meta { padding: 6px 8px; }
  .sw .sw-name { font-size: 11px; color: var(--text); }
  .sw .sw-val { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
<div class="ds-wrap">
  <div class="ds-head">
    <span class="glyph"></span>
    <h1>hull</h1>
    <span class="sub">design system , tokens &amp; component kit, both themes</span>
  </div>

  <div class="ds-sectitle">Palette &amp; Components</div>
  <div class="panes" id="panes"></div>
</div>

<script>
/* Build the same kit twice, once per theme, from a single template. */
function kit() {
  return `
    <div class="kit-h">Surfaces &amp; semantic</div>
    <div class="swgrid">
      ${sw('App','--bg-app')}${sw('Panel','--bg-panel')}${sw('Card','--bg-card')}${sw('Inset','--bg-inset')}
      ${sw('Accent','--accent')}${sw('Green','--green')}${sw('Amber','--amber')}${sw('Red','--red')}
    </div>

    <div class="kit-h">Text</div>
    <div class="colflex">
      <div style="color:var(--text);font-size:13px">Primary , the quick brown fox</div>
      <div style="color:var(--text-dim);font-size:13px">Dim , supporting label text</div>
      <div style="color:var(--text-faint);font-size:13px">Faint , metadata, hints</div>
      <div class="mono" style="color:var(--text);font-size:12px">mono , https://acme.test:54320</div>
    </div>

    <div class="kit-h">Buttons</div>
    <div class="rowflex">
      <button class="btn btn-primary">Start</button>
      <button class="btn">Restart</button>
      <button class="btn btn-danger">Destroy</button>
      <button class="btn btn-ghost">Cancel</button>
      <button class="btn btn-sm">Small</button>
    </div>

    <div class="kit-h">Inputs &amp; selects</div>
    <div class="colflex">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="input" placeholder="Search sites…"></div>
      <select class="select"><option>PHP 8.3</option><option>PHP 8.2</option><option>PHP 8.1</option></select>
    </div>

    <div class="kit-h">Status dot · chips</div>
    <div class="rowflex">
      <span class="rowflex" style="gap:6px"><span class="dot dot-on pulse"></span><span style="font-size:12px;color:var(--text-dim)">running</span></span>
      <span class="rowflex" style="gap:6px"><span class="dot dot-off"></span><span style="font-size:12px;color:var(--text-dim)">stopped</span></span>
      <span class="rowflex" style="gap:6px"><span class="dot dot-err"></span><span style="font-size:12px;color:var(--text-dim)">error</span></span>
      <span class="chip">laravel</span>
      <span class="chip chip-accent">php 8.3</span>
      <span class="chip chip-mono">:54320</span>
    </div>

    <div class="kit-h">Sidebar nav item</div>
    <div class="colflex" style="max-width:200px">
      <div class="nav-item active">${iconSites()}<span>Sites &amp; Apps</span><span class="nav-count">42</span></div>
      <div class="nav-item">${iconGrid()}<span>Dashboard</span></div>
    </div>

    <div class="kit-h">Tab strip</div>
    <div class="tabs">
      <button class="tab active">Overview</button>
      <button class="tab">Services</button>
      <button class="tab">Logs</button>
      <button class="tab">Settings</button>
    </div>

    <div class="kit-h">Connection block</div>
    <div class="conn">
      ${connRow('host','127.0.0.1')}${connRow('port','54320')}${connRow('user','postgres')}${connRowEmpty('password','(no password)')}
    </div>

    <div class="kit-h">Metric &amp; list row</div>
    <div style="display:grid;grid-template-columns:1fr 1.1fr;gap:10px;align-items:start">
      <div class="metric"><p class="metric-label">Sites running</p><div class="metric-value">18<span class="of"> / 42</span></div></div>
      <div class="card card-pad-0" style="padding:6px">
        <div class="row active"><span class="dot dot-on pulse"></span><span class="row-name">acme</span><span class="row-lock">${iconLock()}</span></div>
        <div class="row"><span class="dot dot-off"></span><span class="row-name">atlas</span><span class="row-lock">${iconLock()}</span></div>
      </div>
    </div>

    <div class="kit-h">Job / log panel</div>
    <div class="logpanel" style="height:96px">
      <div class="ln"><span class="t">10:42:01</span> <span class="ok">✓</span> Container <span class="hl">postgres-16</span> started</div>
      <div class="ln"><span class="t">10:42:01</span> Bound <span class="hl">127.0.0.1:54320</span></div>
      <div class="ln"><span class="t">10:42:02</span> <span class="wn">!</span> certificate expires in 12 days</div>
      <div class="ln"><span class="t">10:42:03</span> ready in <span class="hl">812ms</span></div>
    </div>
  `;
}
function sw(name, varname) {
  return `<div class="sw"><div class="chip-col" style="background:var(${varname})"></div><div class="sw-meta"><div class="sw-name">${name}</div><div class="sw-val">${varname}</div></div></div>`;
}
function connRow(k,v){ return `<div class="conn-row"><span class="conn-key">${k}</span><span class="conn-val">${v}</span>${copyIcon()}</div>`; }
function connRowEmpty(k,v){ return `<div class="conn-row"><span class="conn-key">${k}</span><span class="conn-val empty">${v}</span>${copyIcon()}</div>`; }
function copyIcon(){ return `<button class="copy-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>`; }
function iconSites(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg>`; }
function iconGrid(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`; }
function iconLock(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`; }

const panes = document.getElementById('panes');
panes.innerHTML = `
  <div class="pane" data-theme="dark"><div class="pane-label">Dark</div>${kit()}</div>
  <div class="pane" data-theme="light"><div class="pane-label">Light</div>${kit()}</div>
`;

// copy-button demo feedback
panes.addEventListener('click', e => {
  const b = e.target.closest('.copy-btn');
  if (!b) return;
  b.classList.add('copied');
  setTimeout(() => b.classList.remove('copied'), 900);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hull</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="tokens.css?v=20260616b">
<style>
  html, body { overflow: hidden; }
  .app { display: flex; height: 100vh; width: 100vw; position: relative; }

  /* ---------------- SIDEBAR (frameless / unified) ---------------- */
  .sidebar {
    width: 214px; flex: none;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 0 10px 10px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    padding: 16px 8px 14px;
    -webkit-app-region: drag; user-select: none;
  }
  .brand .glyph { width: 18px; height: 19px; display: block; flex: none; -webkit-user-drag: none; }
  .brand .word { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
  .nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .nav-sep { height: 1px; background: var(--border); margin: 8px 6px; }
  .side-foot { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .daemon-wrap { position: relative; }
  .daemon { width: 100%; justify-content: flex-start; cursor: default; transition: border-color var(--dur-fast) var(--ease); }
  .daemon-wrap:hover .daemon { border-color: var(--border-strong); }
  .daemon-pop {
    position: absolute; left: 0; right: auto; bottom: calc(100% + 8px);
    width: max-content; min-width: 100%; max-width: 320px;
    background: var(--bg-card); border: 1px solid var(--border-strong);
    border-radius: var(--r-card); box-shadow: var(--shadow-pop); padding: 8px;
    opacity: 0; visibility: hidden; transform: translateY(5px);
    transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), visibility var(--dur-fast);
    z-index: 40;
  }
  .daemon-wrap:hover .daemon-pop { opacity: 1; visibility: visible; transform: none; }
  .daemon-pop .dp-head { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 6px 7px; display: flex; align-items: center; gap: 7px; }
  .daemon-pop .dp-head .dp-up { margin-left: auto; color: var(--text-dim); text-transform: none; letter-spacing: 0; font-family: var(--font-mono); }
  .daemon-pop .dp-row { display: flex; align-items: flex-start; gap: 8px; padding: 5px 6px; font-size: var(--fs-12); border-radius: var(--r-sm); }
  .daemon-pop .dp-row .dp-name { color: var(--text); flex: none; }
  .daemon-pop .dp-row .dp-detail { margin-left: auto; padding-left: 16px; color: var(--text-faint); font-family: var(--font-mono); font-size: 11px; text-align: right; white-space: normal; word-break: break-word; }
  .daemon-pop .dp-row .dot { margin-top: 4px; }
  .theme-toggle {
    appearance: none; border: 1px solid var(--border); background: var(--bg-card);
    border-radius: var(--r-ctrl); height: 30px; cursor: pointer; color: var(--text-dim);
    display: flex; align-items: center; gap: 8px; padding: 0 10px; font: inherit; font-size: var(--fs-12);
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .theme-toggle:hover { background: var(--ctrl-hover); color: var(--text); }
  .theme-toggle svg { width: 15px; height: 15px; }
  .theme-toggle .tt-label { text-transform: capitalize; }

  /* ---------------- MAIN ---------------- */
  .main { flex: 1; min-width: 0; overflow: hidden; background: var(--bg-app); position: relative; }

  /* window controls — float in the top-right corner so content stays flush to the top */
  .winctrls { position: absolute; top: 0; right: 0; display: flex; z-index: 30; -webkit-app-region: no-drag; }
  .winbtn { width: 44px; height: 34px; border: none; background: transparent; color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
  .winbtn:hover { background: var(--ctrl-hover); color: var(--text); }
  .winbtn.winclose:hover { background: var(--red); color: #fff; }
  .screen { height: 100%; }

  /* page (dashboard/services) shared scaffold */
  .page { height: 100%; display: flex; flex-direction: column; }
  .page-head {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 24px; padding-right: 150px; border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  .page-head .btn, .page-head button, .page-head select, .page-head input { -webkit-app-region: no-drag; }
  .page-head h1 { font-size: var(--fs-18); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .page-head .ph-sub { color: var(--text-dim); font-size: var(--fs-13); }
  .page-head .spacer { flex: 1; }
  .page-body { flex: 1; overflow: auto; padding: 24px; }
  .page-body.center { display: flex; align-items: center; justify-content: center; }

  /* ---------------- SITES master–detail ---------------- */
  .sites { display: flex; height: 100%; }
  .sites-list {
    width: 266px; flex: none; background: var(--bg-panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .sites-list-head { padding: 14px 12px 8px; display: flex; gap: 8px; align-items: center; }
  .sites-list-head .search { flex: 1; }
  .list-scroll { flex: 1; overflow: auto; padding: 2px 8px 16px; }
  .group { margin-top: 8px; }
  .group-label {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
    padding: 10px 8px 4px; display: flex; align-items: center; gap: 7px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .group-label .gcount { margin-left: auto; }
  .site-row { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: var(--r-ctrl); cursor: pointer; border: 1px solid transparent; transition: background var(--dur-fast) var(--ease); }
  .site-row:hover { background: var(--bg-card); }
  .site-row.active { background: var(--accent-soft); }
  .site-row .sr-name { font-size: var(--fs-13); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site-row.active .sr-name { color: var(--accent-text); }
  .site-row .sr-lock { margin-left: auto; color: var(--text-faint); display: inline-flex; }
  .site-row .sr-lock svg { width: 12px; height: 12px; }
  .site-row.unmanaged { border: 1px dashed var(--border-strong); opacity: 0.72; margin: 2px 0; }
  .site-row.unmanaged .sr-name { color: var(--text-dim); font-style: italic; }
  .site-row.unmanaged .import-link { margin-left: auto; font-size: 11px; color: var(--accent-text); opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
  .site-row.unmanaged:hover { opacity: 1; }
  .site-row.unmanaged:hover .import-link { opacity: 1; }
  .site-row.sel-multi { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .site-row[draggable="true"] { cursor: grab; }
  .group-body { min-height: 4px; border-radius: var(--r-ctrl); }
  .group-body.drag-over, .group-label.drag-over { background: var(--accent-soft); outline: 1px dashed var(--accent); }
  .list-foot { padding: 8px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .list-foot .btn { flex: 1; justify-content: center; }
  .sr-badge { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--accent-text); background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; margin-left: auto; }
  /* ambient job status bar (click → detail modal) */
  .statusbar { position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 200%); display: flex; align-items: center; gap: 10px; width: min(680px, calc(100vw - 48px)); background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--r-card); box-shadow: var(--shadow-pop); padding: 9px 14px; z-index: 70; cursor: pointer; transition: transform .26s var(--ease); }
  .statusbar.show { transform: translate(-50%, 0); }
  .statusbar:hover { border-color: var(--accent); }
  .statusbar .sb-spin { width: 14px; height: 14px; flex: none; border: 2px solid var(--ctrl-border); border-top-color: var(--accent); border-radius: 50%; animation: sb-rot .7s linear infinite; }
  .statusbar.ok .sb-spin { border-color: var(--green); border-top-color: var(--green); animation: none; }
  .statusbar.err .sb-spin { border-color: var(--red); border-top-color: var(--red); animation: none; }
  @keyframes sb-rot { to { transform: rotate(360deg); } }
  .statusbar .sb-title { font-size: var(--fs-13); font-weight: 600; flex: none; }
  .statusbar .sb-line { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .statusbar .sb-more { font-size: 11px; color: var(--text-faint); flex: none; }
  /* job status modal: progress bar + streaming log */
  .jobbar { height: 6px; border-radius: 999px; background: var(--bg-inset); overflow: hidden; margin-bottom: 12px; position: relative; }
  .jobbar .jobbar-fill { position: absolute; inset: 0; width: 40%; border-radius: 999px; background: var(--accent); animation: jb-slide 1.1s ease-in-out infinite; }
  .jobbar.ok .jobbar-fill { width: 100%; background: var(--green); animation: none; }
  .jobbar.err .jobbar-fill { width: 100%; background: var(--red); animation: none; }
  @keyframes jb-slide { 0% { left: -40%; } 100% { left: 100%; } }
  .joblog { margin: 0; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-ctrl); padding: 10px 12px; font-family: var(--font-mono); font-size: 11px; line-height: 1.55; color: var(--text-dim); height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  /* container cards (cluster wizard) */
  .ccard { border: 1px solid var(--border); border-radius: var(--r-card); padding: 12px; margin-bottom: 10px; background: var(--bg-card-2); }
  .ccard-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .ccard-head .input { flex: 1; }
  .ccard .docker-results { max-height: 168px; }
  .ccard-sel { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .ccard-sel .csvc { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .ccard-sel .csvc-row { display: flex; gap: 8px; align-items: center; }
  /* right-click context menu */
  .ctx-menu { position: fixed; z-index: 60; min-width: 168px; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--r-card); box-shadow: var(--shadow-pop); padding: 5px; }
  .ctx-menu button { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none; color: var(--text); font: inherit; font-size: var(--fs-13); text-align: left; padding: 7px 9px; border-radius: var(--r-sm); cursor: pointer; }
  .ctx-menu button:hover { background: var(--ctrl-hover); }
  .ctx-menu .ctx-head { font-size: 11px; color: var(--text-faint); padding: 4px 9px 6px; font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctx-menu .ctx-label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); padding: 6px 9px 2px; }
  .ctx-menu .ctx-sep { height: 1px; background: var(--border); margin: 4px 2px; }

  /* detail pane */
  .detail { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .detail-head { padding: 40px 24px 0; border-bottom: 1px solid var(--border); -webkit-app-region: drag; }
  .detail-head button, .detail-head .url-btn, .detail-head input, .detail-head select, .detail-head .tabs { -webkit-app-region: no-drag; }
  .dh-top { display: flex; align-items: center; gap: 10px; }
  .dh-title { font-size: var(--fs-22); font-weight: 600; letter-spacing: -0.015em; }
  .dh-url-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 16px; }
  .url-btn {
    display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono);
    font-size: var(--fs-14); color: var(--accent-text); background: var(--accent-soft);
    border: 1px solid transparent; border-radius: var(--r-ctrl); padding: 7px 12px; cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
  }
  .url-btn:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  .url-btn svg { width: 13px; height: 13px; }
  .dh-actions { display: flex; gap: 8px; }
  .detail-tabs { padding: 0 24px; }
  .detail-body { flex: 1; overflow: auto; padding: 22px 24px; }

  /* overview */
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .svc-card { display: flex; align-items: center; gap: 12px; padding: 14px; }
  .svc-ic { width: 34px; height: 34px; border-radius: 8px; background: var(--bg-card-2); display: flex; align-items: center; justify-content: center; color: var(--text-dim); flex: none; }
  .svc-card .sc-name { font-size: var(--fs-13); font-weight: 500; }
  .svc-card .sc-meta { font-size: var(--fs-12); color: var(--text-dim); }
  .path-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 14px; }
  .path-row .pr-path { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  .section-label { font-size: var(--fs-12); font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 12px; }
  .section-label.mt { margin-top: 26px; }

  /* services tab inside a site */
  .link-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
  .link-row + .link-row { margin-top: 8px; }

  /* settings danger zone */
  .danger { border-color: color-mix(in srgb, var(--red) 30%, var(--border)); }
  .danger .section-label { color: var(--red); }

  /* empty state */
  .empty { text-align: center; max-width: 320px; }
  .empty .ic { width: 46px; height: 46px; margin: 0 auto 14px; color: var(--text-faint); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 12px; }
  .empty h2 { font-size: var(--fs-16); font-weight: 600; margin: 0 0 6px; }
  .empty p { color: var(--text-dim); margin: 0 0 16px; }

  /* dashboard */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; }
  .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; }
  .health { display: flex; align-items: flex-start; gap: 12px; padding: 14px; }
  .health .h-ic { color: var(--text-dim); margin-top: 1px; }
  .health .h-name { font-size: var(--fs-13); font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .health .h-detail { font-size: var(--fs-12); color: var(--text-dim); margin-top: 2px; }
  .activity-row { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: 1px solid var(--border); }
  .activity-row:last-child { border-bottom: none; }
  .activity-row .a-time { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-faint); width: 60px; flex: none; }
  .activity-row .a-msg { font-size: var(--fs-13); }
  .activity-row .a-detail { font-size: var(--fs-12); color: var(--text-dim); margin-left: auto; font-family: var(--font-mono); }
  .dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .dash-cols { grid-template-columns: 1fr; } }
  .dash-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r-sm); }
  .dash-row[data-site] { cursor: pointer; }
  .dash-row[data-site]:hover { background: var(--bg-card-2); }
  .dash-row .dr-name { font-size: var(--fs-13); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .dash-row .chip { flex: none; }
  .dash-row .dr-actions { margin-left: auto; flex: none; display: flex; gap: 6px; }

  /* services screen instance cards */
  .inst-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px,1fr)); gap: 14px; }
  .inst { padding: 0; overflow: hidden; }
  .inst-head { display: flex; align-items: center; gap: 11px; padding: 14px 16px; }
  .inst-head .ih-ic { width: 32px; height: 32px; border-radius: 8px; background: var(--bg-card-2); display: flex; align-items: center; justify-content: center; color: var(--text-dim); flex: none; }
  .inst-head .ih-name { font-size: var(--fs-14); font-weight: 600; }
  .inst-head .ih-actions { margin-left: auto; display: flex; gap: 6px; }
  .inst-body { padding: 0 16px 16px; }
  .inst-url { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: var(--fs-12); color: var(--accent-text); cursor: pointer; margin-bottom: 12px; }
  .inst-url svg { width: 12px; height: 12px; }
  .linked-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .linked-chips .lc-label { font-size: var(--fs-12); color: var(--text-faint); margin-right: 2px; }
  .inst-foot { display: flex; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--bg-card-2) 50%, transparent); flex-wrap: wrap; }

  /* engine picker dialog */
  .cat-group { margin-bottom: 18px; }
  .cat-group:last-child { margin-bottom: 0; }
  .cat-label { font-size: var(--fs-11); font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 8px; }
  .engine-opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-ctrl); cursor: pointer; transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
  .engine-opt + .engine-opt { margin-top: 6px; }
  .engine-opt:hover { background: var(--bg-card-2); }
  .engine-opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .engine-opt .eo-ic { width: 30px; height: 30px; border-radius: 7px; background: var(--bg-card-2); display: flex; align-items: center; justify-content: center; color: var(--text-dim); flex: none; }
  .engine-opt .eo-name { font-size: var(--fs-13); font-weight: 500; }
  .engine-opt .eo-blurb { font-size: var(--fs-12); color: var(--text-dim); }
  .engine-opt .eo-ver { margin-left: auto; }

  /* type-to-confirm */
  .confirm-name { font-family: var(--font-mono); color: var(--red); }

  /* ---------------- provisioning pickers (project/import dialogs) ---------------- */
  .dialog-lg { width: min(600px, calc(100vw - 48px)); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-row { margin-bottom: 14px; }
  .form-row:last-child { margin-bottom: 0; }
  .detect-chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-12); color: var(--accent-text); background: var(--accent-soft); border-radius: var(--r-pill); padding: 4px 10px; }
  .browse-row { display: flex; gap: 8px; }
  .pick-list { display: flex; flex-direction: column; gap: 6px; }
  .pick-cat { font-size: var(--fs-11); font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 6px; }
  .pick-cat:first-child { margin-top: 0; }
  .pick-row {
    display: flex; align-items: center; gap: 11px; padding: 9px 11px;
    border: 1px solid var(--border); border-radius: var(--r-ctrl); cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
  }
  .pick-row:hover { background: var(--bg-card-2); }
  .pick-row.sel { border-color: var(--accent); background: var(--accent-soft); }
  .pick-box { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--border-strong); flex: none; position: relative; transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
  .pick-row.sel .pick-box { background: var(--accent); border-color: var(--accent); }
  .pick-row.sel .pick-box::after { content: ""; position: absolute; left: 5px; top: 2px; width: 4px; height: 8px; border: solid var(--text-on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .pick-row .eo-ic { width: 28px; height: 28px; border-radius: 7px; background: var(--bg-card-2); display: flex; align-items: center; justify-content: center; color: var(--text-dim); flex: none; }
  .pick-row.sel .eo-ic { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-text); }
  .pick-ver { margin-left: auto; width: auto !important; }

  /* toggle switch */
  .switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; font-size: var(--fs-13); }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--ctrl-border); position: relative; transition: background var(--dur-fast) var(--ease); flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.3); transition: transform var(--dur-fast) var(--ease); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); }

  /* advanced collapsible */
  .adv-toggle { display: flex; align-items: center; gap: 7px; width: 100%; background: none; border: none; color: var(--text-dim); font: inherit; font-size: var(--fs-13); font-weight: 500; cursor: pointer; padding: 10px 0; }
  .adv-toggle svg { transition: transform var(--dur-fast) var(--ease); }
  .adv-toggle.open svg { transform: rotate(90deg); }
  .adv-body { display: none; padding-top: 4px; }
  .adv-body.open { display: block; }
  .help { font-size: var(--fs-12); color: var(--text-faint); margin: 4px 0 0; }
  textarea.input { height: auto; padding: 8px 10px; font-family: var(--font-mono); font-size: var(--fs-12); resize: vertical; line-height: 1.5; }

  /* segmented directory control */
  .seg { display: inline-flex; background: var(--bg-inset); border: 1px solid var(--ctrl-border); border-radius: var(--r-ctrl); padding: 3px; gap: 3px; }
  .seg-btn { appearance: none; border: none; background: transparent; color: var(--text-dim); font: inherit; font-size: var(--fs-13); font-weight: 500; padding: 6px 14px; border-radius: 5px; cursor: pointer; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
  .seg-btn:hover { color: var(--text); }
  .seg-btn.active { background: var(--accent); color: var(--text-on-accent); }
  .path-preview { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-faint); margin-top: 10px; word-break: break-all; }
  .path-preview b { color: var(--accent-text); font-weight: 600; }

  /* services repeater */
  .rep-rows { display: flex; flex-direction: column; gap: 8px; }
  .rep-rows:not(:empty) { margin-bottom: 10px; }
  .rep-row { display: flex; gap: 8px; align-items: center; }
  .rep-row .rep-engine { flex: 1; min-width: 0; }
  .rep-row .rep-version { width: 130px; flex: none; }
  .rep-remove { flex: none; color: var(--text-faint); }
  .rep-remove:hover { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--ctrl-border)); }
  .rep-empty { font-size: var(--fs-12); color: var(--text-faint); padding: 4px 0 10px; }

  /* docker hub search */
  .docker-status { font-size: var(--fs-12); color: var(--text-faint); margin: 8px 0 6px; display: flex; align-items: center; gap: 7px; }
  .docker-results { display: flex; flex-direction: column; gap: 6px; max-height: 248px; overflow: auto; }
  .docker-result { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--r-ctrl); cursor: pointer; transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
  .docker-result:hover { background: var(--bg-card-2); }
  .docker-result.sel { border-color: var(--accent); background: var(--accent-soft); }
  .docker-result .dr-ic { width: 28px; height: 28px; border-radius: 7px; background: var(--bg-card-2); display: flex; align-items: center; justify-content: center; color: var(--text-dim); flex: none; }
  .docker-result.sel .dr-ic { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-text); }
  .docker-result .dr-name { font-family: var(--font-mono); font-size: var(--fs-13); font-weight: 500; }
  .docker-result .dr-name .ns { color: var(--text-faint); }
  .docker-result .dr-desc { font-size: var(--fs-12); color: var(--text-dim); }
  .docker-result .dr-meta { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 11px; color: var(--text-faint); flex: none; }
  .badge-official { font-size: 10px; font-weight: 600; color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 42%, transparent); border-radius: 4px; padding: 2px 5px; letter-spacing: 0.02em; }
  .docker-result .dr-ver { height: 28px; padding: 0 22px 0 8px; font-size: var(--fs-12); flex: none; }
  .star-btn { appearance: none; border: none; background: none; color: var(--text-faint); cursor: pointer; display: flex; padding: 2px; border-radius: var(--r-sm); flex: none; }
  .star-btn:hover { color: var(--text-dim); }
  .star-btn.on { color: var(--accent); }
  .star-btn.on svg { fill: var(--accent); }
  .dr-check { color: var(--accent-text); opacity: 0; flex: none; }
  .docker-result.sel .dr-check { opacity: 1; }
  .dockerfile-ed { font-family: var(--font-mono); font-size: var(--fs-12); line-height: 1.55; min-height: 168px; tab-size: 2; }

  /* ---------------- code block (Mail .env / SMTP) ---------------- */
  .codeblock { background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-ctrl); overflow: hidden; }
  .codeblock-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: var(--fs-12); color: var(--text-dim); font-weight: 500; }
  .codeblock-head .cb-copy { margin-left: auto; }
  .codeblock pre { margin: 0; padding: 12px 14px; font-family: var(--font-mono); font-size: var(--fs-12); line-height: 1.65; color: var(--text); overflow: auto; white-space: pre; }
  .codeblock pre .ck { color: var(--text-faint); }

  /* ---------------- Mail ---------------- */
  .mail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .wire-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .wire-row:last-child { border-bottom: none; }
  .wire-row .wr-name { font-size: var(--fs-13); font-weight: 500; }
  .wire-row .wr-meta { font-size: var(--fs-12); color: var(--text-dim); }

  /* ---------------- Logs ---------------- */
  .logs-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 24px; border-bottom: 1px solid var(--border); }
  .logs-toolbar .search { width: 220px; }
  .logs-toolbar label.field-label { margin: 0 0 0 6px; }
  .logs-toolbar .input, .logs-toolbar .select, .logs-toolbar .search .input { height: 30px; }
  .logs-toolbar .seg { height: 30px; padding: 0 3px; align-items: center; }
  .logs-toolbar .seg-btn { height: 24px; padding: 0 12px; display: flex; align-items: center; }
  .logs-body { flex: 1; padding: 16px 24px 24px; overflow: hidden; display: flex; }
  .logs-body .logpanel { flex: 1; }
  .logpanel .src { color: var(--accent-text); }

  /* ---------------- Settings ---------------- */
  .settings-body { max-width: 780px; }
  .setting-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .setting-row:last-child { border-bottom: none; }
  .setting-row .sr-info { flex: 1; min-width: 0; }
  .setting-row .sr-name { font-size: var(--fs-13); font-weight: 500; }
  .setting-row .sr-desc { font-size: var(--fs-12); color: var(--text-dim); margin-top: 2px; }
  .setting-row .sr-ctrl { flex: none; }
  .folder-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-ctrl); }
  .folder-row + .folder-row { margin-top: 8px; }
  .folder-row .fr-label { font-size: var(--fs-12); font-weight: 600; color: var(--text-dim); width: 48px; flex: none; }
  .folder-row .fr-path { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dep-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .dep-row:last-child { border-bottom: none; }
  .dep-row .dep-ic { width: 30px; height: 30px; border-radius: 7px; background: var(--bg-card-2); display: flex; align-items: center; justify-content: center; color: var(--text-dim); flex: none; }
  .dep-row .dep-name { font-size: var(--fs-13); font-weight: 500; }
  .dep-row .dep-meta { font-size: var(--fs-12); color: var(--text-dim); font-family: var(--font-mono); margin-top: 1px; }
  .dep-row .dep-action { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; border-radius: var(--r-pill); padding: 3px 9px; white-space: nowrap; }
  .status-ok { color: var(--green); background: var(--green-soft); }
  .status-update { color: var(--amber); background: var(--amber-soft); }
  .status-missing { color: var(--red); background: var(--red-soft); }
  .doctor-row { display: flex; align-items: flex-start; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .doctor-row:last-child { border-bottom: none; }
  .doctor-row .dx-name { font-size: var(--fs-13); }
  .doctor-row .dx-detail { font-size: var(--fs-12); color: var(--text-dim); margin-top: 1px; }

  /* loopback address octets */
  .addr { display: inline-flex; align-items: center; gap: 0; }
  .addr .octet { width: 48px; height: 34px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: var(--fs-13); border: 1px solid var(--ctrl-border); border-radius: var(--r-sm); background: var(--bg-inset); color: var(--text-faint); }
  .addr .dot { color: var(--text-faint); font-weight: 700; margin: 0 5px; }
  .octet-edit { position: relative; display: inline-flex; }
  .octet-input { width: 48px; height: 34px; text-align: center; font-family: var(--font-mono); font-size: var(--fs-13); border: 1px solid var(--accent); border-radius: var(--r-sm); background: var(--bg-card); color: var(--text); padding: 0 16px 0 4px; cursor: default; }
  .octet-input:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
  .octet-steps { position: absolute; right: 3px; top: 3px; bottom: 3px; display: flex; flex-direction: column; gap: 1px; }
  .octet-steps button { flex: 1; width: 14px; border: none; background: var(--bg-card-2); color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; padding: 0; }
  .octet-steps button:hover { background: var(--ctrl-hover); color: var(--text); }
  .octet-steps svg { width: 9px; height: 9px; }
</style>
